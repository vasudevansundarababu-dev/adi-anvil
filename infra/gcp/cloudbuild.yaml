# Builds the three ADI Anvil images on Cloud Build (linux/amd64).
# Substitutions: _REPO (Artifact Registry path), _TAG (commit-timestamp).
steps:
  - id: backend
    name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'infra/docker/backend.Dockerfile', '-t', '${_REPO}/backend:${_TAG}', '.']
  - id: web
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args: ['build', '-f', 'infra/docker/web.Dockerfile', '-t', '${_REPO}/web:${_TAG}', '.']
  - id: harbor
    name: gcr.io/cloud-builders/docker
    waitFor: ['backend']
    args:
      [
        'build',
        '-f',
        'infra/docker/harbor.Dockerfile',
        '--build-arg',
        'BACKEND_IMAGE=${_REPO}/backend:${_TAG}',
        '-t',
        '${_REPO}/harbor:${_TAG}',
        '.',
      ]
  - id: golden-environment
    name: gcr.io/cloud-builders/docker
    waitFor: ['-']
    args:
      [
        'build',
        '-f',
        'fixtures/executable-import/environment/Dockerfile',
        '-t',
        '${_REPO}/golden-tools:${_TAG}',
        'fixtures/executable-import/environment',
      ]
images:
  - '${_REPO}/backend:${_TAG}'
  - '${_REPO}/web:${_TAG}'
  - '${_REPO}/harbor:${_TAG}'
  - '${_REPO}/golden-tools:${_TAG}'
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 2400s
