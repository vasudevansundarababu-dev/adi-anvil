[project]
name = "adi-anvil"
version = "0.2.1"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary,pool]>=3.2,<4",
  "httpx>=0.28,<1", "authlib>=1.4,<2", "cryptography>=44",
  "langgraph>=1,<2", "langgraph-checkpoint-postgres>=3,<4",
  "neo4j>=5.28,<7", "reportlab>=4.3,<5", "python-multipart>=0.0.20",
  "openai>=2,<3", "anthropic>=0.70,<1", "google-genai>=1,<2", "mistralai>=1,<3"
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11", "pypdf>=5,<7"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/anvil"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
extend = "../../ruff.toml"
