[project]
name = "anvil-openenv-trial"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["openenv==0.12.0", "adi-anvil", "pytest>=8,<10", "pydantic==2.13.5", "psycopg[binary,pool]==3.3.6"]

[tool.uv]
package = false

[tool.uv.sources]
# Development SDK checks execute the current source checkout. Production task
# images retain the separate frozen wheel-only services/harbor/runtime closure.
adi-anvil = { path = "../backend", editable = true }
